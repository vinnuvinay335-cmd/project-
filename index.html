<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Smart Pillow Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
<style>
  :root {
    --bg:#0f172a; --panel:#1e293b; --line:#334155; --text:#e2e8f0;
    --muted:#94a3b8; --ok:#22c55e; --warn:#f59e0b; --bad:#ef4444; --accent:#38bdf8;
  }
  * { box-sizing: border-box; }
  body {
    margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); padding: 16px;
  }
  h1 { font-size: 1.4rem; margin: 0 0 12px; letter-spacing: .5px; }
  h1 span { color: var(--accent); }
  .grid { display: grid; gap: 12px; }
  @media (min-width: 1000px) {
    .grid { grid-template-columns: 1fr 1fr; }
    .full { grid-column: 1 / -1; }
  }
  .card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 14px;
  }
  .card h2 { margin: 0 0 10px; font-size: .95rem; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .5px; }

  /* Live tiles */
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px,1fr)); gap: 10px; }
  .tile { background: #0b1220; border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
  .tile .label { font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; }
  .tile .value { font-size: 1.5rem; font-weight: 700; margin-top: 4px; }
  .badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: .8rem; font-weight: 700; }
  .ok    { background: rgba(34,197,94,.15);  color: var(--ok); }
  .warn  { background: rgba(245,158,11,.15); color: var(--warn); }
  .bad   { background: rgba(239,68,68,.15);  color: var(--bad); }
  .idle  { background: rgba(148,163,184,.15); color: var(--muted); }

  /* Chart */
  .chart-wrap { position: relative; height: 320px; }

  /* Alerts table */
  .alert-list { max-height: 320px; overflow-y: auto; }
  table { width: 100%; border-collapse: collapse; font-size: .85rem; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 600; position: sticky; top: 0; background: var(--panel); }
  td.type { font-weight: 700; }
  td.type.apnea  { color: var(--bad); }
  td.type.noise  { color: var(--warn); }
  td.type.pt     { color: var(--accent); }
  .empty { color: var(--muted); font-style: italic; padding: 12px 0; }
  .status-line { font-size: .8rem; color: var(--muted); margin-top: 8px; }
  .status-line.online { color: var(--ok); }
  .status-line.offline { color: var(--bad); }
</style>
</head>
<body>

<h1>Smart Pillow <span>Dashboard</span></h1>

<div class="grid">

  <!-- LIVE TILES -->
  <div class="card full">
    <h2>Live Status</h2>
    <div class="tiles">
      <div class="tile">
        <div class="label">Status</div>
        <div class="value" id="t-status"><span class="badge idle">—</span></div>
      </div>
      <div class="tile">
        <div class="label">Patient</div>
        <div class="value" id="t-patient">—</div>
      </div>
      <div class="tile">
        <div class="label">Breath Rate</div>
        <div class="value" id="t-br">— <small style="font-size:.7rem;color:var(--muted)">/min</small></div>
      </div>
      <div class="tile">
        <div class="label">FSR</div>
        <div class="value" id="t-fsr">—</div>
      </div>
      <div class="tile">
        <div class="label">Piezo Amp</div>
        <div class="value" id="t-amp">—</div>
      </div>
      <div class="tile">
        <div class="label">Sound</div>
        <div class="value" id="t-sound">—</div>
      </div>
      <div class="tile">
        <div class="label">Faults</div>
        <div class="value" id="t-faults" style="font-size:1rem">—</div>
      </div>
      <div class="tile">
        <div class="label">Uptime</div>
        <div class="value" id="t-uptime" style="font-size:1.1rem">—</div>
      </div>
    </div>
    <div class="status-line" id="conn">Connecting to Firebase…</div>
  </div>

  <!-- CHART -->
  <div class="card full">
    <h2>Live Sensor Trends — Recent History</h2>
    <div class="chart-wrap"><canvas id="chart"></canvas></div>
  </div>

  <!-- ALERTS -->
  <div class="card full">
    <h2>Alert Log (newest first)</h2>
    <div class="alert-list" id="alerts">
      <div class="empty">Waiting for alerts…</div>
    </div>
  </div>

</div>

<!-- =========================================================
     Firebase Realtime Database over REST (no SDK required).
     Uses ?auth=<secret>; if you switch to Firebase Auth later,
     replace `AUTH` with an ID token.
     ========================================================= -->
<script type="module">
  const DB_URL  = "https://billow-37092-default-rtdb.asia-southeast1.firebasedatabase.app";
  const AUTH    = "nVqLdVpnotQI2gnWARaDbC7QYhurd0ar4dFTrKON"; // <-- regenerate this!
  const BASE    = `${DB_URL}`;
  const LIVE_PATH   = "/smartPillow/live";
  const HIST_PATH   = "/smartPillow/history";
  const ALERTS_PATH = "/smartPillow/alerts";

  async function fbGet(path) {
    const url = `${BASE}${path}.json?auth=${encodeURIComponent(AUTH)}`;
    const res = await fetch(url);
    if (!res.ok) throw new Error(`GET ${path} → ${res.status}`);
    return res.json();
  }

  // ---------- Helpers ----------
  const fmtTime = ts => {
    // ts is seconds (from ESP32). If it looks like ms, still works.
    const d = new Date(ts * 1000);
    return d.toLocaleTimeString();
  };
  const fmtDateTime = ts => new Date(ts * 1000).toLocaleString();

  // ---------- Live tiles ----------
  const $ = id => document.getElementById(id);

  function renderLive(live) {
    if (!live) return;
    const status = (live.status || "IDLE").toUpperCase();
    const statusCls =
      status === "NORMAL" ? "ok" :
      status === "APNEA"  ? "bad" :
      status === "NOISE"  ? "warn" :
      status === "FAULT"  ? "bad" : "idle";
    $("t-status").innerHTML = `<span class="badge ${statusCls}">${status}</span>`;

    $("t-patient").textContent = live.patient ? "PRESENT" : "ABSENT";
    $("t-br").innerHTML  = `${live.breathRate ?? "—"} <small style="font-size:.7rem;color:var(--muted)">/min</small>`;
    $("t-fsr").textContent = live.fsr ?? "—";
    $("t-amp").textContent = live.piezoAmp ?? "—";
    $("t-sound").textContent = live.sound ?? "—";
    $("t-faults").textContent = live.faults ?? "—";
    $("t-uptime").textContent = live.uptime ?? "—";
  }

  // ---------- Updated combined sensor chart ----------
  const ctx = document.getElementById("chart").getContext("2d");
  const chart = new Chart(ctx, {
    type: "line",
    data: { labels: [], datasets: [
      { label: "Breath Rate (/min)", data: [], borderColor: "#38bdf8", backgroundColor: "rgba(56,189,248,.12)", tension: .35, fill: false, pointRadius: 0, borderWidth: 2, yAxisID: "y" },
      { label: "FSR Pressure", data: [], borderColor: "#f59e0b", tension: .3, pointRadius: 0, borderWidth: 2, yAxisID: "y1" },
      { label: "Piezo Amplitude", data: [], borderColor: "#22c55e", tension: .3, pointRadius: 0, borderWidth: 2, yAxisID: "y1" },
      { label: "Sound Sensor", data: [], borderColor: "#f472b6", tension: .3, pointRadius: 0, borderWidth: 2, yAxisID: "y1" }
    ]},
    options: {
      responsive: true, maintainAspectRatio: false, animation: false,
      interaction: { mode: "index", intersect: false },
      plugins: {
        legend: { labels: { color: "#e2e8f0", usePointStyle: true, padding: 16 } },
        tooltip: { callbacks: { title: items => items.length ? items[0].label : "" } }
      },
      scales: {
        x: { type: "category", ticks: { color: "#94a3b8", maxTicksLimit: 8 }, grid: { color: "rgba(148,163,184,.08)" } },
        y: { type: "linear", position: "left", beginAtZero: true, suggestedMax: 30, title: { display: true, text: "Breaths/min", color: "#38bdf8" }, ticks: { color: "#38bdf8" }, grid: { color: "rgba(148,163,184,.1)" } },
        y1: { type: "linear", position: "right", beginAtZero: true, suggestedMax: 4095, title: { display: true, text: "Raw sensor values", color: "#f59e0b" }, ticks: { color: "#f59e0b" }, grid: { drawOnChartArea: false } }
      }
    }
  });

  function renderHistory(hist) {
    const entries = hist ? Object.values(hist).filter(e => e && Number.isFinite(Number(e.ts))) : [];
    entries.sort((a, b) => Number(a.ts) - Number(b.ts));
    const src = entries.slice(-200);
    const labels = src.map(e => new Date(Number(e.ts) * 1000).toLocaleTimeString());
    chart.data.labels = labels;
    chart.data.datasets[0].data = src.map(e => Number(e.br ?? e.breathRate ?? 0));
    chart.data.datasets[1].data = src.map(e => Number(e.fsr ?? 0));
    chart.data.datasets[2].data = src.map(e => Number(e.piezoAmp ?? e.piezo ?? 0));
    chart.data.datasets[3].data = src.map(e => Number(e.sound ?? 0));
    chart.update("none");
  }

  // Add a live point if history hasn't produced an entry yet; keeps the graph visible.
  function appendLivePoint(live) {
    if (!live) return;
    const label = new Date().toLocaleTimeString();
    if (chart.data.labels.length === 0) {
      chart.data.labels.push(label);
      chart.data.datasets[0].data.push(Number(live.breathRate ?? 0));
      chart.data.datasets[1].data.push(Number(live.fsr ?? 0));
      chart.data.datasets[2].data.push(Number(live.piezoAmp ?? 0));
      chart.data.datasets[3].data.push(Number(live.sound ?? 0));
      chart.update("none");
    }
  }


  // ---------- Alerts ----------
  function alertClass(type) {
    if (!type) return "";
    if (type.startsWith("APNEA"))  return "apnea";
    if (type.startsWith("NOISE"))  return "noise";
    if (type.startsWith("PATIENT"))return "pt";
    return "";
  }

  function renderAlerts(alertsObj) {
    const el = $("alerts");
    if (!alertsObj) {
      el.innerHTML = `<div class="empty">No alerts yet.</div>`;
      return;
    }
    const rows = Object.entries(alertsObj)
      .map(([id, a]) => ({ id, ...a }))
      .filter(a => a && a.ts)
      .sort((a, b) => b.ts - a.ts)
      .slice(0, 100);

    if (!rows.length) {
      el.innerHTML = `<div class="empty">No alerts yet.</div>`;
      return;
    }

    el.innerHTML = `
      <table>
        <thead>
          <tr><th>Time</th><th>Type</th><th>Detail</th><th>BR</th><th>FSR</th><th>Sound</th></tr>
        </thead>
        <tbody>
          ${rows.map(a => `
            <tr>
              <td>${fmtDateTime(a.ts)}</td>
              <td class="type ${alertClass(a.type)}">${a.type ?? "—"}</td>
              <td>${a.detail ?? "—"}</td>
              <td>${a.br ?? "—"}</td>
              <td>${a.fsr ?? "—"}</td>
              <td>${a.sound ?? "—"}</td>
            </tr>
          `).join("")}
        </tbody>
      </table>`;
  }

  // ---------- Polling (REST) ----------
  // RTDB SDK would give you live events; here we poll every 3 s.
  async function poll() {
    try {
      const [live, hist, alerts] = await Promise.all([
        fbGet(LIVE_PATH),
        fbGet(HIST_PATH),
        fbGet(ALERTS_PATH),
      ]);
      renderLive(live);
      renderHistory(hist);
      if (!hist || Object.keys(hist).length === 0) appendLivePoint(live);
      renderAlerts(alerts);

      const conn = $("conn");
      conn.textContent = `Online — last sync ${new Date().toLocaleTimeString()}`;
      conn.className = "status-line online";
    } catch (err) {
      const conn = $("conn");
      conn.textContent = `Offline — ${err.message}`;
      conn.className = "status-line offline";
      console.error(err);
    }
  }

  poll();
  setInterval(poll, 3000);
</script>
</body>
</html>
